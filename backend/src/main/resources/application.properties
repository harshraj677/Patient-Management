spring.application.name=patient-admission

# Optional local secrets file (gitignored). Format: KEY=value per line.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

# Database (Neon PostgreSQL) - supplied via environment variables, never hardcoded.
# DATABASE_URL must be JDBC format: jdbc:postgresql://<host>/<db>?sslmode=require
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=5000
# Fail fast instead of hanging if a network connection to Neon drops (seconds)
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# JPA / Hibernate - "update" creates/updates tables without deleting data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Run schema.sql on startup (it only creates the patient ID sequence if missing)
spring.sql.init.mode=always

# Reject decimal ages like 12.5 instead of silently truncating them
spring.jackson.deserialization.accept-float-as-int=false

# Comma-separated list of allowed frontend origins (wildcards supported)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app}
