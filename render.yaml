services:
  - type: web
    name: dscribe-patient-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://dscribe-patients.vercel.app,http://localhost:5173
      - key: APP_TIMEZONE
        value: Asia/Kolkata
